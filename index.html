<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fórum MegaMan</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <header class="text-center py-4">
        <img src="https://upload.wikimedia.org/wikipedia/pt/d/de/Mega_man_logo.png" alt="MegaMan Logo" class="img-fluid" style="max-width: 300px;">
    </header>

    <main>
        <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
            <div class="card shadow-lg p-4 rounded-4 bg-card-custom" style="width: 100%; max-width: 400px;">
                <h1 class="text-center mb-4">Login</h1>

                <div id="mensagemErro" class="alert alert-danger d-none" role="alert"></div>
                <div id="mensagemSucesso" class="alert alert-success d-none" role="alert"></div>

                <form id="Login">
                    <div class="mb-3">
                        <label class="form-label" for="usuario">Usuário</label>
                        <input class="form-control" type="text" name="usuario" id="usuario" placeholder="Digite seu usuário">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="senha">Senha</label>
                        <input class="form-control" type="password" name="senha" id="senha" placeholder="Digite sua senha">
                    </div>

                    <div class="mb-3 text-center">
                        <small class="text-muted">Não possui conta? <a href="#">Cadastre-se</a></small>
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted">
        <small>&copy; 2026 Fórum MegaMan - Todos os direitos reservados</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+mNKM1zDJcZ6A6yVs3zLaZ9uKg9yG9O2IRc1AIV5U4G8cFU28qFtX3U5dVdG3oGkcbe1cKh2fEV8x6w6"
        crossorigin="anonymous"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
